name: Backend Unit Tests

on:
  pull_request:
    branches:
      - master
      - develop

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  backendUnitTests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/set-up
      # Execute unit tests for pure JVM modules (backend and dto)
      - name: Backend Unit Tests
        run: ./gradlew :backend:test :dto:test
