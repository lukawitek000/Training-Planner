[versions]
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.4.10"
composeBom = "2026.09.00"
nav3Core = "1.1.7"
lifecycleViewmodelNav3 = "2.11.0"
kotlinSerialization = "2.4.10"
kotlinxSerializationCore = "1.11.0"
material3AdaptiveNav3 = "1.3.0"
koin = "4.2.2"
koinCompiler = "1.1.0"
ksp = "2.3.10"
detekt = "1.23.4"
ktlint = "11.6.1"
room = "3.0.3"
coroutines = "1.11.0"
lifecycle = "2.11.0"

[libraries]

# Google
google-playServicesWearable = { module = "com.google.android.gms:play-services-wearable", version = "18.1.0" }
google-gson = { module = "com.google.code.gson:gson", version = "2.14.0" }
google-material = { module = "com.google.android.material:material", version = "1.14.0" }

# KotlinX
kotlinx-coroutines-playServices = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

# AndroidX
androidx-core = { module = "androidx.core:core", version = "1.19.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.7.0" }
androidx-wear = { module = "androidx.wear:wear", version = "1.3.0" }
androidx-wearOngoing = { module = "androidx.wear:wear-ongoing", version = "1.0.0" }
androidx-activityKtx = { module = "androidx.activity:activity-ktx", version = "1.8.0" }
androidx-fragmentKtx = { module = "androidx.fragment:fragment-ktx", version = "1.6.1" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material = { module = "androidx.compose.material:material" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material = { module = "androidx.compose.material:material", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Core Icons (Mandatory/Base set)
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
# Extended Icons (Optional, but contains full library: search, favorite, etc.)
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Room
androidx-roomRuntime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
# androidx-roomKtx = { module = "androidx.room3:room3-ktx", version.ref = "room" }
androidx-roomCompiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }

# Core Navigation 3 libraries
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "nav3Core" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Core" }

# Optional add-on libraries
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycleViewmodelNav3" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinxSerializationCore" }
androidx-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3", version.ref = "material3AdaptiveNav3" }
koin-annotations = { group = "io.insert-koin", name = "koin-annotations", version.ref = "koin" }

# 3rd party
kotlinReflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin"}

# Additional app libraries
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version = "2.6.2" }
androidx-lifecycle-viewmodelKtx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version = "2.6.2" }
androidx-lifecycle-livedataKtx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }

timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }
coil = { module = "com.github.skydoves:landscapist-coil", version = "2.13.2" }
bytebeats-charts = { module = "io.github.bytebeats:compose-charts", version = "0.2.1" }
androidx-compose-navigation = { module = "androidx.navigation:navigation-compose", version = "2.10.1" }
androidx-compose-lifecycleViewmodelCompose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.6.2" }

# Koin BOM
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }

# Koin Libraries (without explicit versions so they inherit from the BOM)
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-compose = { group = "io.insert-koin", name = "koin-compose" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel" }
koin-compose-navigation3 = { group = "io.insert-koin", name = "koin-compose-navigation3" }

roboelectric = { module = "org.robolectric:robolectric", version = "4.11.1" }
androidx-testCore = { module = "androidx.test:core", version = "1.5.0" }
kotlinTestJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
mockk = { module = "io.mockk:mockk", version = "1.13.3" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinSerialization"}
koin-compiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompiler" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
#room = ["androidx-roomRuntime", "androidx-roomKtx"]
koin = [
    "koin-android",
    "koin-compose",
    "koin-compose-viewmodel",
    "koin-compose-navigation3"
]
