    <path d="M 346,130 C 340,135 332,132 324,124 L 280,80 C 277,76 280,70 284,68 L 290,68 C 294,68 297,72 302,76 Z" fill="#111111" fill-opacity="0.22" stroke="#111111" stroke-width="2" stroke-opacity="0.6" />
    
