    <rect x="287" y="60" width="45" height="20" rx="4" fill="#888888" fill-opacity="0.9" />
    
    <!-- Motion Trajectory Arrow -->
    <path d="M 256,190 L 256,120" stroke="#FF0000" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow)" />

