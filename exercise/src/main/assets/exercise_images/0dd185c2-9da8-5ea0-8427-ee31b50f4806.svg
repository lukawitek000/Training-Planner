        <path d="M 206,195 C 210,240 215,290 220,340 C 232,345 250,345 260,340 C 255,290 250,240 246,195 Z" fill="#111111" fill-opacity="0.22" stroke="#111111" stroke-width="2" stroke-opacity="0.6" />
